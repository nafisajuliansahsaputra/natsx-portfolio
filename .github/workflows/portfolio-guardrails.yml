name: Portfolio Guardrails

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Typecheck, lint, media audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare runtime GLB aliases
        run: node scripts/optimize-3d.mjs --prepare-only

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Media resilience audit
        run: npm run audit:media
