name: Optimize 3D assets once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/optimize-3d-assets-once.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install glTF Transform
        run: npm install --global @gltf-transform/cli@4.5.0

      - name: Optimize large GLB assets conservatively
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "public/models/iphone-17-pro-max.glb"
            "public/models/attendance/imac.glb"
            "public/models/attendance/scanner.glb"
            "public/models/bast/macbook-pro.glb"
          )

          printf "%-58s %12s %12s %10s\n" "FILE" "BEFORE" "AFTER" "SAVED"

          for file in "${files[@]}"; do
            before=$(stat -c%s "$file")
            output="${file%.glb}.optimized.glb"

            gltf-transform optimize "$file" "$output" \
              --no-compress \
              --no-instance \
              --no-palette \
              --no-flatten \
              --no-join \
              --no-simplify \
              --no-weld \
              --texture-compress webp \
              --texture-size 2048

            gltf-transform inspect "$output" >/dev/null

            after=$(stat -c%s "$output")

            if [ "$after" -lt "$before" ]; then
              mv "$output" "$file"
              saved=$((before - after))
              percent=$(awk -v b="$before" -v a="$after" 'BEGIN { printf "%.1f%%", ((b-a)/b)*100 }')
              printf "%-58s %12d %12d %10s\n" "$file" "$before" "$after" "$percent"
            else
              rm -f "$output"
              printf "%-58s %12d %12d %10s\n" "$file" "$before" "$before" "kept"
            fi
          done

      - name: Show changed asset sizes
        run: |
          git diff --stat
          du -h \
            public/models/iphone-17-pro-max.glb \
            public/models/attendance/imac.glb \
            public/models/attendance/scanner.glb \
            public/models/bast/macbook-pro.glb

      - name: Commit optimized assets
        shell: bash
        run: |
          if git diff --quiet --             public/models/iphone-17-pro-max.glb             public/models/attendance/imac.glb             public/models/attendance/scanner.glb             public/models/bast/macbook-pro.glb; then
            echo "No smaller validated assets produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             public/models/iphone-17-pro-max.glb             public/models/attendance/imac.glb             public/models/attendance/scanner.glb             public/models/bast/macbook-pro.glb

          git commit -m "perf: compress large 3D assets"
          git push origin HEAD:main
