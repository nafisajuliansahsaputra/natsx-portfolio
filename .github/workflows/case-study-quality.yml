name: Portfolio Case Study Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/work/smart-cafe-system/**"
      - "src/app/[locale]/work/smart-cafe-system/**"
      - "src/app/work/page.tsx"
      - "src/app/work/Work.module.css"
      - "src/app/sitemap.ts"
      - "tests/e2e/smart-cafe-case-study.spec.ts"
      - ".github/workflows/case-study-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cafe-case-study-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Next.js production build and multilingual Chromium acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript checks
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build actual portfolio
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test locale routes, source evidence, sitemap and 320px layout
        run: npx playwright test tests/e2e/smart-cafe-case-study.spec.ts --reporter=line
      - name: Retain only failing browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-cafe-case-study-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
