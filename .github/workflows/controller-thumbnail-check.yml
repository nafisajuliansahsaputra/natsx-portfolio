name: Controller thumbnail validation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/home/NatsxController*'
      - '.github/workflows/controller-thumbnail-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx eslint src/components/home/NatsxControllerScene.tsx src/components/home/NatsxControllerSceneGate.tsx src/components/home/NatsxControllerArtwork.tsx
