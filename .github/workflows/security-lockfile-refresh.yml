name: Temporary Security Lockfile Refresh

on:
  push:
    branches:
      - security/portfolio-oct-2026-node-next
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-lockfile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up patched Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refresh lockfile from npm registry (no code changes)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched dependency versions
        run: |
          node -e '
          const lock = require("./package-lock.json");
          const next = lock.packages["node_modules/next"]?.version;
          const sharp = lock.packages["node_modules/sharp"]?.version;
          const eslintNext = lock.packages["node_modules/eslint-config-next"]?.version;
          console.log({node: process.version, next, sharp, eslintNext});
          if (next !== "16.4.3" || eslintNext !== "16.4.3" || sharp !== "0.35.5") process.exit(1);
          '

      - name: Validate frozen install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Commit generated lockfile on security branch
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): refresh lockfile for patched Next.js and Sharp"
          git push origin HEAD:security/portfolio-oct-2026-node-next

      - name: Production build regression check
        run: npm run build
