name: Temporary Security Lockfile Refresh

on:
  push:
    branches:
      - security/portfolio-oct-2026-node-next
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up patched Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Regenerate lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Assert only patched versions resolve
        run: |
          node -e '
          const lock = require("./package-lock.json");
          const required = {
            "node_modules/next": "16.4.3",
            "node_modules/eslint-config-next": "16.4.3",
            "node_modules/sharp": "0.35.5",
            "node_modules/source-map-js": "1.2.2"
          };
          for (const [path, version] of Object.entries(required)) {
            const found = lock.packages[path]?.version;
            console.log(path, found);
            if (found !== version) process.exitCode = 1;
          }
          const zod = lock.packages["node_modules/zod"]?.version || "0";
          console.log("zod", zod);
          if (!/^4\.(?:[7-9]|[1-9][0-9])\.|^4\.6\.(?:[6-9]|[1-9][0-9])$/.test(zod)) process.exitCode = 1;
          '

      - name: Confirm no high or critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Verify frozen installation
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Commit regenerated lockfile only
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): lock patched Zod and source-map-js"
          git push origin HEAD:security/portfolio-oct-2026-node-next
