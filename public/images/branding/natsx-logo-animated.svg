<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 380" role="img" aria-labelledby="natsx-title natsx-desc">
  <title id="natsx-title">NATSX</title>
  <desc id="natsx-desc">Animated vector NATSX logo traced from the original logo asset.</desc>
  <style>
    .logo-part {
      fill: transparent;
      stroke: #111111;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: natsx-draw 980ms cubic-bezier(.16,1,.3,1) forwards;
    }
    .logo-part-1 { animation-delay: 120ms; }
    .logo-part-2 { animation-delay: 0ms; }
    .logo-part-3 { animation-delay: 170ms; }
    .logo-part-4 { animation-delay: 270ms; }
    .logo-part-5 { animation-delay: 380ms; }
    .logo-part-6 { animation-delay: 490ms; }
    .logo-part-7 { animation-delay: 530ms; }
    .logo-part-8 { animation-delay: 650ms; }
    .logo-part-9 { animation-delay: 780ms; }

    @keyframes natsx-draw {
      0% {
        fill: rgba(17, 17, 17, 0);
        stroke: #5862ec;
        stroke-dashoffset: 1;
        opacity: .35;
      }
      20% {
        opacity: 1;
      }
      62% {
        fill: rgba(17, 17, 17, 0);
        stroke: #111111;
        stroke-dashoffset: 0;
      }
      82% {
        fill: rgba(17, 17, 17, .28);
        stroke: #111111;
        stroke-dashoffset: 0;
      }
      100% {
        fill: #111111;
        stroke: rgba(17, 17, 17, 0);
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo-part {
        animation-duration: 1ms;
        animation-delay: 0ms;
        fill: #111111;
        stroke: transparent;
      }
    }
  </style>
